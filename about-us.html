<!DOCTYPE html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>O nama — Beli Drim 2014 DOO</title>
    <meta
      name="description"
      content="Beli Drim 2014 DOO je porodična transportna firma osnovana 2014. godine. Saznajte više o našem voznom parku, iskustvu i vrednostima."
    />
    <meta name="theme-color" content="#0d2440" />
    <link rel="icon" href="src/img/logoBD.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="O nama — Beli Drim 2014 DOO" />
    <meta property="og:image" content="src/img/truck1.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/css/style.css" />
    <script type="module" src="src/js/main.js"></script>
  </head>
  <body>
    <header id="site-header"></header>

    <main>
      <section class="page-hero">
        <span class="eyebrow" data-i18n="about.eyebrow"></span>
        <h1 data-i18n="about.title"></h1>
      </section>

      <section class="section">
        <div class="container">
          <div class="about__layout">
            <div class="about__text">
              <p data-i18n="about.p1"></p>
              <p data-i18n="about.p2"></p>
              <p data-i18n="about.p3"></p>
              <p data-i18n="about.p4"></p>
              <p data-i18n="about.p5"></p>
            </div>
            <div class="about__img">
              <img
                src="src/img/truck1.jpg"
                alt="Beli Drim kamion"
                loading="lazy"
              />
            </div>
          </div>
        </div>
      </section>

      <section class="section section--soft">
        <div class="container">
          <div class="section__head">
            <h2 class="section__title" data-i18n="about.valuesTitle"></h2>
          </div>
          <div class="values__grid">
            <article class="value-card">
              <span class="value-card__icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m9.55 17.6-4.2-4.2 1.4-1.4 2.8 2.8 6.7-6.7 1.4 1.4-8.1 8.1Z"/></svg>
              </span>

              <p data-i18n="about.value1.text"></p>
            </article>
            <article class="value-card">
              <span class="value-card__icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1 3 5v6c0 5 3.8 9.7 9 11 5.2-1.3 9-6 9-11V5l-9-4Zm0 10.9h7c-.5 4-3.3 7.6-7 8.7V12H5V6.3l7-3.1V12Z"/></svg>
              </span>
              <h3 data-i18n="about.value2.title"></h3>
              <p data-i18n="about.value2.text"></p>
            </article>
            <article class="value-card">
              <span class="value-card__icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 4h11a1 1 0 0 1 1 1v9H2V5a1 1 0 0 1 1-1Zm13 4h3.2a1 1 0 0 1 .8.4l2.8 3.7a1 1 0 0 1 .2.6V14h-7V8ZM6.5 15a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm11 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z"/></svg>

              <h3 data-i18n="about.value3.title"></h3>
              <p data-i18n="about.value3.text"></p>
            </article>
            <article class="value-card">
              <span class="value-card__icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21 3c-7 0-13 2-13 9 0 1.4.3 2.6.8 3.6L6 18.4l1.4 1.4 2.8-2.8c1 .5 2.2.8 3.6.8 7 0 7-9 7-14ZM11 14c0-3 2.5-5 6-5.5-3 .8-5 2.8-6 5.5Z"/></svg>
              </span>
              <h3 data-i18n="about.value4.title"></h3>
              <p data-i18n="about.value4.text"></p>
            </article>
          </div>
        </div>
      </section>

      <section class="cta-band">
        <div class="cta-band__inner">
          <h2 data-i18n="cta.title"></h2>
          <p data-i18n="cta.text"></p>
          <a href="kontakt.html" class="btn btn--light" data-i18n="cta.button"></a>
        </div>
      </section>
    </main>

    <footer id="site-footer"></footer>
  </body>
</html>
