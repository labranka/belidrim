<!DOCTYPE html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galerija — Beli Drim 2014 DOO</title>
    <meta
      name="description"
      content="Galerija voznog parka Beli Drim 2014 DOO — pogledajte našu flotu savremenih vozila za transport robe."
    />
    <meta name="theme-color" content="#0d2440" />
    <link rel="icon" href="src/img/logoBD.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Galerija — Beli Drim 2014 DOO" />
    <meta property="og:image" content="src/img/bd1.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/css/style.css" />
    <script type="module" src="src/js/main.js"></script>
  </head>
  <body>
    <header id="site-header"></header>

    <main>
      <section class="page-hero">
        <span class="eyebrow" data-i18n="gallery.eyebrow"></span>
        <h1 data-i18n="gallery.title"></h1>
        <p data-i18n="gallery.intro"></p>
      </section>

      <section class="section">
        <div class="container">
          <div class="slider">
            <div class="slider__viewport">
              <div class="slide"><img src="src/img/truck1.jpg" alt="Kamion Beli Drim" /></div>
              <div class="slide"><img src="src/img/bd1.jpg" alt="Vozni park 1" loading="lazy" /></div>
              <div class="slide"><img src="src/img/bd2.jpg" alt="Vozni park 2" loading="lazy" /></div>
              <div class="slide"><img src="src/img/bd3.jpg" alt="Vozni park 3" loading="lazy" /></div>
              <div class="slide"><img src="src/img/bd4.jpg" alt="Vozni park 4" loading="lazy" /></div>
              <div class="slide"><img src="src/img/bd5.jpg" alt="Vozni park 5" loading="lazy" /></div>
              <div class="slide"><img src="src/img/bd6.jpg" alt="Vozni park 6" loading="lazy" /></div>
              <div class="slide"><img src="src/img/bd7.jpg" alt="Vozni park 7" loading="lazy" /></div>
              <div class="slide"><img src="src/img/bd8.jpg" alt="Vozni park 8" loading="lazy" /></div>
              <div class="slide"><img src="src/img/bd9.jpg" alt="Vozni park 9" loading="lazy" /></div>
              <div class="slide"><img src="src/img/bd10.jpg" alt="Vozni park 10" loading="lazy" /></div>
            </div>
            <button class="slider__btn slider__btn--left" aria-label="Prethodna slika">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><polyline points="15 5 8 12 15 19" /></svg>
            </button>
            <button class="slider__btn slider__btn--right" aria-label="Sledeća slika">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><polyline points="9 5 16 12 9 19" /></svg>
            </button>
            <div class="dots"></div>
          </div>
        </div>
      </section>

      <section class="cta-band">
        <div class="cta-band__inner">
          <h2 data-i18n="cta.title"></h2>
          <p data-i18n="cta.text"></p>
          <a href="kontakt.html" class="btn btn--light" data-i18n="cta.button"></a>
        </div>
      </section>
    </main>

    <footer id="site-footer"></footer>
  </body>
</html>
