<!DOCTYPE html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beli Drim 2014 DOO — Transport robe u Srbiji i regionu</title>
    <meta
      name="description"
      content="Beli Drim 2014 DOO — pouzdan i siguran prevoz robe u Srbiji i regionu. Sopstveni vozni park i dugogodišnje iskustvo. Zatražite ponudu."
    />
    <meta name="theme-color" content="#0d2440" />
    <link rel="icon" href="src/img/logoBD.svg" type="image/svg+xml" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Beli Drim 2014 DOO — Transport bez stresa" />
    <meta
      property="og:description"
      content="Pouzdan prevoz robe u Srbiji i regionu. Sopstveni vozni park i dugogodišnje iskustvo."
    />
    <meta property="og:image" content="src/img/highway.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/css/style.css" />
    <script type="module" src="src/js/main.js"></script>
  </head>
  <body>
    <header id="site-header"></header>

    <main>
      <!-- Hero -->
      <section class="hero">
        <img
          class="hero__bg"
          src="src/img/truck2.jpg"
          alt=""
          fetchpriority="high"
        />
        <div class="hero__inner">
          <div class="hero__content">
            <h1 class="hero__title">BELI DRIM 2014</h1>
            <p class="hero__tagline" data-i18n="hero.tagline"></p>
            <p class="hero__subtitle" data-i18n="hero.subtitle"></p>
            <div class="hero__actions">
              <a href="kontakt.html" class="btn btn--accent" data-i18n="hero.ctaPrimary"></a>
              <a href="about-us.html" class="btn btn--outline" data-i18n="hero.ctaSecondary"></a>
            </div>
          </div>

          <div class="stats">
            <div class="stat">
              <div class="stat__num">10+</div>
              <div class="stat__label" data-i18n="stats.years"></div>
            </div>
            <div class="stat">
              <div class="stat__num">10+</div>
              <div class="stat__label" data-i18n="stats.trucks"></div>
            </div>
            <div class="stat">
              <div class="stat__num">5+</div>
              <div class="stat__label" data-i18n="stats.countries"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- About preview -->
      <section class="section">
        <div class="container">
          <div class="about-preview__grid">
            <div class="about-preview__img">
              <img
                src="src/img/truck1.jpg"
                alt="Beli Drim kamion na putu"
                loading="lazy"
              />
            </div>
            <div class="about-preview__text">
              <span class="eyebrow" data-i18n="home.aboutEyebrow"></span>
              <h2 data-i18n="home.aboutTitle"></h2>
              <p data-i18n="home.aboutText"></p>
              <a href="about-us.html" class="link-arrow" data-i18n="home.aboutLink"></a>
            </div>
          </div>
        </div>
      </section>

      <!-- Services -->
      <section class="section section--soft">
        <div class="container">
          <div class="section__head">
            <span class="eyebrow" data-i18n="services.eyebrow"></span>
            <h2 class="section__title" data-i18n="services.title"></h2>
            <p class="section__subtitle" data-i18n="services.subtitle"></p>
          </div>
          <div class="services__grid">
            <article class="service-card">
              <span class="service-card__icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 4h11a1 1 0 0 1 1 1v9H2V5a1 1 0 0 1 1-1Zm13 4h3.2a1 1 0 0 1 .8.4l2.8 3.7a1 1 0 0 1 .2.6V14h-7V8ZM6.5 15a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm11 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z"/></svg>
              </span>
              <h3 data-i18n="services.card1.title"></h3>
              <p data-i18n="services.card1.text"></p>
            </article>
            <article class="service-card">
              <span class="service-card__icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.9 9h-3.2a15.6 15.6 0 0 0-1-5 8 8 0 0 1 4.2 5ZM12 4.2c.9 1.2 1.7 3.3 1.9 6.8h-3.8c.2-3.5 1-5.6 1.9-6.8ZM4.1 13h3.2c.1 2 .5 3.7 1 5a8 8 0 0 1-4.2-5Zm3.2-2H4.1a8 8 0 0 1 4.2-5c-.5 1.3-.9 3-1 5Zm2.8 2h3.8c-.2 3.5-1 5.6-1.9 6.8-.9-1.2-1.7-3.3-1.9-6.8Zm4.7 5c.5-1.3.9-3 1-5h3.2a8 8 0 0 1-4.2 5Z"/></svg>
              </span>
              <h3 data-i18n="services.card2.title"></h3>
              <p data-i18n="services.card2.text"></p>
            </article>
            <article class="service-card">
              <span class="service-card__icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.7 6.3a1 1 0 0 0-1.6-.3l-2.5 2.5-2.1-2.1 2.5-2.5A1 1 0 0 0 17.7 2a5 5 0 0 0-6.3 6.1L3.7 15.8a2.5 2.5 0 0 0 3.5 3.5l7.7-7.7A5 5 0 0 0 21.7 6.3ZM6.5 18.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"/></svg>
              </span>
              <h3 data-i18n="services.card3.title"></h3>
              <p data-i18n="services.card3.text"></p>
            </article>
          </div>
        </div>
      </section>

      <!-- CTA band -->
      <section class="cta-band">
        <div class="cta-band__inner">
          <h2 data-i18n="cta.title"></h2>
          <p data-i18n="cta.text"></p>
          <a href="kontakt.html" class="btn btn--light" data-i18n="cta.button"></a>
        </div>
      </section>
    </main>

    <footer id="site-footer"></footer>
  </body>
</html>
